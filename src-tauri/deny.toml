# cargo deny check: advisories, licences, duplicate crates and where crates come from.

[graph]
# Onyx ships for macOS only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
ignore = [
  # See .cargo/audit.toml for why.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack: no fix; local SSH/MySQL key use only" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "0BSD",
]
confidence-threshold = 0.9
# Onyx itself is private (publish = false), so it needs no licence.
private = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
